name: Release

on:
  push:
    tags: ['v*']

env:
  NODE_VERSION: '22'

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage

      - name: Build
        run: npm run build

  desktop-macos:
    name: Desktop macOS
    runs-on: macos-latest
    needs: [test]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: cd desktop && npm ci

      - name: Build macOS installers
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Smoke test packaged backend
        run: npm run smoke:desktop-packaged

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.dmg.blockmap
          retention-days: 14

  desktop-windows:
    name: Desktop Windows
    runs-on: windows-latest
    needs: [test]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: cd desktop && npm ci

      - name: Build Windows installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run dist:windows

      - name: Smoke test packaged backend
        shell: pwsh
        run: npm run smoke:desktop-packaged:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: |
            dist-desktop/*.exe
            dist-desktop/*.exe.blockmap
          retention-days: 14

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [test, desktop-macos, desktop-windows]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: desktop-macos
          path: dist-desktop

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: desktop-windows
          path: dist-desktop

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release v${VERSION}"
          fi
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate electron-updater manifests
        run: node desktop/scripts/generate-update-manifests.js

      - name: List desktop artifacts
        run: ls -lah dist-desktop/

      - name: Create GitHub Release with desktop installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.VERSION }}
          body: |
            ${{ steps.changelog.outputs.NOTES }}

            ## Desktop installers

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `Inauzwa CRM-*-arm64.dmg` |
            | macOS (Intel) | `Inauzwa CRM-*.dmg` (without arm64 suffix) |
            | Windows | `Inauzwa CRM Setup *.exe` |

            Internet is required. Use a Neon `DATABASE_URL` on first run.
          files: dist-desktop/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Release
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
