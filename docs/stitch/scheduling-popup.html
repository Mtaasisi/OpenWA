<!-- Micro-interactions Script -->
<script>
        // Simple handler to simulate slot selection
        const slots = document.querySelectorAll('.grid-cols-4 button:not([disabled])');
        slots.forEach(slot => {
            slot.addEventListener('click', () => {
                slots.forEach(s => {
                    s.classList.remove('border-2', 'border-primary', 'bg-primary', 'text-white', 'shadow-md');
                    s.classList.add('border-outline-variant', 'text-on-surface-variant');
                });
                slot.classList.add('border-2', 'border-primary', 'bg-primary', 'text-white', 'shadow-md');
                slot.classList.remove('border-outline-variant', 'text-on-surface-variant');
            });
        });

        // Background click to close
        window.addEventListener('click', (e) => {
            const modal = document.getElementById('modalOverlay');
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
